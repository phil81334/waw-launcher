[package]
name = "waw-launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
notify = "8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
